defaults:
  - dataloader
  - general
  - metrics
  - dataset: beauty

dataloader:
  train:
    batch_size: 128

hydra:
  run:
    dir: outputs/${base_dir}/${model_name}__${dataset.name}__${now:%H-%M-%S}

base_dir: ${now:%Y-%m-%d}

model:
  # sasrec
  embedding_dim: 64
  num_heads: 1
  num_layers: 4
  dim_feedforward: 64
  dropout: 0.5
  # other
  activation: gelu
  layer_norm_eps: 1.0e-09
  topk_k: null

optimizer:
  optimizer:
    type: adamw
    lr: 0.0021002963516611
    weight_decay: 0.0
  # lr(L) = lr_ref * sqrt(reference_num_layers / L)
  lr_scaling:
    type: sqrt_depth
    reference_num_layers: 4
  clip_grad_threshold: 10.0

loss:
  _target_: src.loss.LocalObjective

model_name: sasrec
